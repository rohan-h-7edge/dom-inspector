service: dom-inspector-collab-hub

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 256
  timeout: 10
  environment:
    DOM_INSPECTOR_COLLAB_DB_URL: ${env:DOM_INSPECTOR_COLLAB_DB_URL}
    DOM_INSPECTOR_COLLAB_DB_AUTH_TOKEN: ${env:DOM_INSPECTOR_COLLAB_DB_AUTH_TOKEN}
  httpApi:
    cors: true

functions:
  collabHub:
    handler: dist-lambda/index.handler
    events:
      - httpApi: '*'

package:
  patterns:
    - dist-lambda/**
    - '!node_modules/**'
    - '!src/**'
    - '!client/**'
    # Excluded so Lambda doesn't inherit this package's "type": "module" and
    # try to load the CommonJS-bundled dist-lambda/index.js as an ES module.
    - '!package.json'
    - '!package-lock.json'
    - '!dist/**'
    - '!dist-hub/**'
    - '!fly.toml'
    - '!deploy/**'
